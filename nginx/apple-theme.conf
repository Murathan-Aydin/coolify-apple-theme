# coolify-apple-theme: injects the theme into every Coolify page.
# Mounted at /etc/nginx/conf.d/apple-theme.conf (http level) in the coolify
# container. Remove the file and reload nginx to turn the theme off.
sub_filter '</head>' '<link rel="stylesheet" href="/apple-theme/apple-theme.css?v=__VERSION__" data-apple-theme><script src="/apple-theme/apple-theme.js?v=__VERSION__" data-navigate-once></script></head>';
sub_filter_once on;
